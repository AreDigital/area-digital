<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página no encontrada | Área Digital</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="images/favicon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --cyan: #00d4ff; --cyan-dim: #00a8cc; --dark: #0a0e14; --dark2: #0d1520;
      --card-bg: #0d1e2e; --teal2: #0d3347; --text: #e8edf2; --muted: #8a9bb0; --white: #ffffff;
    }
    html, body { height: 100%; }
    body {
      font-family: 'Inter', sans-serif; background: var(--dark); color: var(--text);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 24px; overflow-x: hidden;
    }
    .logo-img { height: 52px; width: auto; margin-bottom: 48px; }
    .code {
      font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: clamp(64px, 14vw, 140px);
      line-height: 1; color: var(--cyan); text-shadow: 0 0 40px rgba(0,212,255,0.35);
      letter-spacing: 4px;
    }
    h1 {
      font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: clamp(20px, 3vw, 28px);
      margin-top: 18px; color: var(--text);
    }
    p {
      font-size: 15px; line-height: 1.7; color: var(--muted); max-width: 440px;
      margin: 14px auto 36px;
    }
    .btn-home {
      display: inline-flex; align-items: center; gap: 10px; text-decoration: none;
      background: var(--cyan); color: #04121a; font-family: 'Rajdhani', sans-serif;
      font-weight: 700; font-size: 16px; letter-spacing: 0.5px; padding: 14px 32px;
      border-radius: 30px; transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 0 0 rgba(0,212,255,0);
    }
    .btn-home:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,212,255,0.25); }
    @media (max-width: 480px) {
      .logo-img { height: 42px; margin-bottom: 32px; }
    }
  </style>
</head>
<body>

  <a href="/">
    <img src="images/area-digital.webp" alt="Área Digital" class="logo-img" />
  </a>

  <div class="code">404</div>
  <h1>Esta página no existe</h1>
  <p>El link que escribiste no lo encontramos. Puede que esté mal escrito o que la página ya no esté disponible.</p>

  <a href="/" class="btn-home">&larr; Volver al inicio</a>

</body>
</html>
